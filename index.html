<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #eef1ef;
    --ink: #2e2a24;
    --ink-soft: #5a5347;
    --line: #4b463d;
    --shadow: rgba(46,42,36,0.25);
    --scene-w: min(97vw, 1320px);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper: #eef1ef;
      --ink: #2e2a24;
    }
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0;
    padding:0;
    background: #f6f1e6;
    color: var(--ink);
    font-family: 'Patrick Hand', cursive, sans-serif;
    overflow-x: hidden;
  }
  body{
    min-height: 100vh;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    padding: 24px 16px 40px;
  }
  h1.visually-hidden{
    position:absolute; width:1px;height:1px; overflow:hidden; clip:rect(0,0,0,0);
  }
  .scene-wrap{
    width: 100%;
    display:flex;
    justify-content:center;
  }
  .scene{
    position: relative;
    width: var(--scene-w);
    aspect-ratio: 1400 / 640;
    flex-shrink: 0;
  }
  .scroll-hint{
    display:none;
    text-align:center;
    color: var(--ink-soft);
    font-size: .95rem;
    margin: 0 0 6px;
  }
  @media (max-width: 700px){
    .scene-wrap{
      justify-content: flex-start;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 8px;
    }
    .scene{ width: 1000px; }
    .card .label{ font-size: 0.95rem; }
    .scroll-hint{ display:block; }
  }
  .scene svg{
    position:absolute; inset:0; width:100%; height:100%; display:block;
  }
  .sketch{ fill:none; stroke: var(--ink-soft); stroke-width:2; stroke-linecap:round; }
  .sketch-light{ fill:none; stroke: #b9b0a0; stroke-width:1.6; stroke-linecap:round; }
  .roof-fill{ fill:#e7e1d1; }
  .ground-fill{ fill:#e2dcc9; }
  .banner{ fill:#fbf7ec; stroke:var(--ink); stroke-width:2; }
  .banner-text{
    font-family:'Kalam', cursive;
    font-weight:700;
    fill: var(--ink);
    text-anchor:middle;
  }

  .cards-layer{ position:absolute; inset:0; }

  .card{
    position:absolute;
    width: 11%;
    aspect-ratio: 5 / 5.6;
    background: var(--card-color, #ffe9a8);
    border-radius: 6px 10px 8px 12px / 10px 8px 12px 6px;
    box-shadow: 0 6px 10px var(--shadow), 0 1px 0 rgba(255,255,255,.4) inset;
    border: 1.5px solid rgba(46,42,36,0.55);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 4%;
    text-decoration:none;
    color: var(--ink);
    padding: 6% 5%;
    overflow: hidden;
    transform: rotate(var(--tilt, -3deg));
    transform-origin: top center;
    transition: transform .18s ease, box-shadow .18s ease;
    cursor: pointer;
  }
  .card:hover, .card:focus-visible{
    transform: rotate(0deg) translateY(-6%) scale(1.06);
    box-shadow: 0 12px 18px var(--shadow), 0 1px 0 rgba(255,255,255,.5) inset;
    z-index: 5;
    outline: none;
  }
  .card:focus-visible{
    outline: 2.5px dashed var(--ink);
    outline-offset: 3px;
  }
  .pin{
    position:absolute;
    top:-7%;
    left:50%;
    transform: translateX(-50%);
    width: 15%;
    aspect-ratio: 1;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #ff8a7a, #c73b2c 70%);
    border: 1px solid #7a2317;
    box-shadow: 0 2px 3px var(--shadow);
  }
  .card svg.pdf-icon{
    width: 24%;
    height: auto;
    flex-shrink:0;
  }
  .card .label{
    text-align:center;
    font-size: clamp(0.72rem, 1.55vw, 1.15rem);
    line-height: 1.32;
    font-weight: 700;
  }

  .periods{
    display:flex;
    flex-wrap: wrap;
    justify-content:center;
    gap: 10px 14px;
    margin: 0 0 14px;
  }
  .periods button{
    font: inherit;
    font-size: 1.25rem;
    color: var(--ink);
    background: #fffdf7;
    border: 1.5px solid rgba(46,42,36,.5);
    border-radius: 8px 12px 9px 11px / 11px 8px 12px 9px;
    padding: 8px 18px;
    box-shadow: 0 3px 6px var(--shadow);
    cursor: pointer;
    transition: transform .15s ease;
  }
  .periods button:hover{ transform: translateY(-2px); }
  .periods button:focus-visible{ outline: 2.5px dashed var(--ink); outline-offset: 3px; }
  .periods button[aria-pressed="true"]{
    background: #FFE9A8;
    font-weight: 700;
    border-color: var(--ink);
  }

  .caption{
    margin-top: 26px;
    background: #fffdf7;
    border: 1.5px solid rgba(46,42,36,.5);
    border-radius: 10px;
    padding: 10px 22px;
    text-align:center;
    box-shadow: 0 4px 10px var(--shadow);
    max-width: 92vw;
  }
  .caption strong{
    font-family:'Kalam', cursive;
    font-size: 1.4rem;
    letter-spacing: .04em;
  }
  .caption p{
    margin: 6px 0 0;
    color: var(--ink-soft);
    font-size: 1.15rem;
  }

  .scene-art-layer{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
  }
  .scene-art{
    position:absolute;
    top:73%;
    width:8.8%;
    height:26%;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:auto;
    transform:translateX(-50%) rotate(var(--art-tilt, 0deg));
    transition:transform .2s ease, filter .2s ease;
  }
  .scene-art.top-art{
    top:11%;
    width:8%;
    height:7%;
  }
  .scene-art:hover,
  .scene-art:focus-visible{
    z-index:1;
    transform:translateX(-50%) translateY(-5%) rotate(0deg) scale(1.08);
    filter:drop-shadow(0 5px 5px var(--shadow));
  }
  .scene-art:focus-visible{
    outline:2.5px dashed var(--ink);
    outline-offset:2px;
  }
  .scene-art img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    filter:drop-shadow(0 3px 3px rgba(46,42,36,.22));
  }
</style>
</head>

<script>
  // AUTO-GENERATED by update_site.py from the dated folders in reports/ --
  // do not hand-edit this block, run `python update_site.py` instead.
  // REPORTS:START
  const PERIODS = [
    { label: "10.16.26", reports: [
      { title: "Inventory by Brand & Collection", file: "INVENTORY BY BRAND AND COLLECTION.pdf", color: "#FFE9A8", v: "37f5afc7" },
      { title: "Monthly Sales YTD vs 2025", file: "monthly sales ytd vs 2025.pdf", color: "#AEE3FF", v: "bd8c2c69" },

    { label: "10.9.26", reports: [
      { title: "Inventory by Brand & Collection", file: "INVENTORY BY BRAND AND COLLECTION.pdf", color: "#FFE9A8", v: "10f5730c" },
      { title: "Monthly Sales YTD vs 2025", file: "monthly sales ytd vs 2025.pdf", color: "#AEE3FF", v: "a7e07a1d" },
      { title: "Open Sales by Brand & Customer", file: "open sales by brand and customer.pdf", color: "#FFC2D9", v: "46b7ef79" },
      { title: "Sales by Collection", file: "SALES BY COLLECTION.pdf", color: "#C6F6D5", v: "8d6e129d" },
      { title: "YTD Sales by Brand", file: "ytd sales by brand.pdf", color: "#E0D1FF", v: "42e1fc84" },
      { title: "YTD Sales by Customer", file: "ytd sales by customer.pdf", color: "#FFD3AE", v: "43ecfa43" },
    ] },
    { label: "10.2.26", reports: [
      { title: "Inventory by Brand & Collection", file: "INVENTORY BY BRAND AND COLLECTION.pdf", color: "#FFE9A8", v: "daf2d8f4" },
      { title: "Monthly Sales YTD vs 2025", file: "monthly sales ytd vs 2025.pdf", color: "#AEE3FF", v: "f7df3465" },
      { title: "Open Sales by Brand & Customer", file: "open sales by brand and customer.pdf", color: "#FFC2D9", v: "6aad9014" },
      { title: "Sales by Collection", file: "SALES BY COLLECTION.pdf", color: "#C6F6D5", v: "04e3d48f" },
      { title: "YTD Sales by Brand", file: "ytd sales by brand.pdf", color: "#E0D1FF", v: "c421af2f" },
      { title: "YTD Sales by Customer", file: "ytd sales by customer.pdf", color: "#FFD3AE", v: "fde4e62d" },
    ] },
    { label: "9.25.26", reports: [
      { title: "Inventory by Brand & Collection", file: "INVENTORY BY BRAND AND COLLECTION.pdf", color: "#FFE9A8", v: "7d859b5d" },
      { title: "Monthly Sales YTD vs 2025", file: "monthly sales ytd vs 2025.pdf", color: "#AEE3FF", v: "6ab02041" },
      { title: "Open Sales by Brand & Customer", file: "open sales by brand and customer.pdf", color: "#FFC2D9", v: "1ee3b77c" },
      { title: "Sales by Collection", file: "SALES BY COLLECTION.pdf", color: "#C6F6D5", v: "f94a0a4a" },
      { title: "YTD Sales by Brand", file: "ytd sales by brand.pdf", color: "#E0D1FF", v: "a9e75286" },
      { title: "YTD Sales by Customer", file: "ytd sales by customer.pdf", color: "#FFD3AE", v: "45688f17" },
    ] },
    { label: "9.18.26", reports: [
      { title: "Inventory by Brand & Collection", file: "INVENTORY BY BRAND AND COLLECTION.pdf", color: "#FFE9A8", v: "1404c3e3" },
      { title: "Monthly Sales YTD vs 2025", file: "monthly sales ytd vs 2025.pdf", color: "#AEE3FF", v: "e0066e8c" },
      { title: "Open Sales by Brand & Customer", file: "open sales by brand and customer.pdf", color: "#FFC2D9", v: "1c95519c" },
      { title: "Sales by Collection", file: "SALES BY COLLECTION.pdf", color: "#C6F6D5", v: "fb11f008" },
      { title: "YTD Sales by Brand", file: "ytd sales by brand.pdf", color: "#E0D1FF", v: "b05d4f70" },
      { title: "YTD Sales by Customer", file: "ytd sales by customer.pdf", color: "#FFD3AE", v: "393ba28e" },
    ] },
  ];
  // REPORTS:END

  const PDF_ICON = `<svg class="pdf-icon" viewBox="0 0 40 48" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 2 H26 L36 12 V46 H4 Z" fill="#fff" stroke="#2e2a24" stroke-width="2"/>
    <path d="M26 2 V12 H36 Z" fill="#e6e0d2" stroke="#2e2a24" stroke-width="2"/>
    <rect x="9" y="24" width="22" height="7" rx="1.5" fill="#c73b2c"/>
    <text x="20" y="29.5" text-anchor="middle" font-family="Patrick Hand, cursive" font-size="7" fill="#fff">PDF</text>
    <line x1="9" y1="37" x2="27" y2="37" stroke="#2e2a24" stroke-width="1.4"/>
    <line x1="9" y1="41" x2="23" y2="41" stroke="#2e2a24" stroke-width="1.4"/>
  </svg>`;

  const SCENE_W = 1400, SCENE_H = 640;
  const LINE_Y0 = 110, SAG = 46;
  const CARD_W = 154, GAP = 14;
  const tiltFor = i => (i % 2 === 0 ? -1 : 1) * (1.4 + (i % 3) * 0.5);

  function lineYAt(xFrac){
    return LINE_Y0 + SAG * 4 * xFrac * (1 - xFrac);
  }

  const layer = document.getElementById("cardsLayer");
  const linePath = document.getElementById("clothesline");
  let d = `M18,${LINE_Y0.toFixed(1)} `;
  const steps = 40;
  for(let s = 1; s <= steps; s++){
    const x = 18 + (1382 - 18) * (s / steps);
    const xFrac = x / SCENE_W;
    d += `L${x.toFixed(1)},${lineYAt(xFrac).toFixed(1)} `;
  }
  linePath.setAttribute("d", d);

  const periodsNav = document.getElementById("periods");
  const periodNote = document.getElementById("periodNote");

  // Newest period is PERIODS[0]; #9.18.26 in the URL opens an older one.
  function currentPeriod(){
    const wanted = decodeURIComponent(location.hash.slice(1));
    return PERIODS.find(p => p.label === wanted) || PERIODS[0];
  }

  PERIODS.forEach(p => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = p === PERIODS[0] ? p.label + " (latest)" : p.label;
    b.dataset.label = p.label;
    b.addEventListener("click", () => {
      // Keep the URL clean for the default (latest) week.
      history.replaceState(null, "", p === PERIODS[0] ? location.pathname : "#" + p.label);
      render(p);
    });
    periodsNav.appendChild(b);
  });
  if (PERIODS.length < 2) periodsNav.hidden = true;
  window.addEventListener("hashchange", () => render(currentPeriod()));

  function render(period){
    periodsNav.querySelectorAll("button").forEach(b =>
      b.setAttribute("aria-pressed", String(b.dataset.label === period.label)));
    periodNote.textContent = "Showing reports for " + period.label + ". ";
    layer.replaceChildren();
    // Row is centered so any number of reports stays balanced.
    const n = period.reports.length;
    const margin = (SCENE_W - (n * CARD_W + (n - 1) * GAP)) / 2;
    period.reports.forEach((r, i) => addCard(period.label, r, i, margin));
  }

  function addCard(label, r, i, margin){
    const cx = margin + CARD_W / 2 + i * (CARD_W + GAP);
    const xFrac = cx / SCENE_W;
    const attachY = lineYAt(xFrac);

    const a = document.createElement("a");
    a.className = "card";
    a.href = "reports/" + encodeURIComponent(label) + "/" + encodeURIComponent(r.file) + "?v=" + r.v;
    a.target = "_blank";
    a.rel = "noopener";
    a.title = r.title;
    a.setAttribute("aria-label", "Open report: " + r.title);
    a.style.setProperty("--tilt", tiltFor(i) + "deg");
    a.style.setProperty("--card-color", r.color);
    a.style.left = ((cx - CARD_W / 2) / SCENE_W * 100) + "%";
    a.style.top = (attachY / SCENE_H * 100) + "%";
    a.style.width = (CARD_W / SCENE_W * 100) + "%";
    a.innerHTML = `<span class="pin"></span>${PDF_ICON}<span class="label">${r.title}</span>`;
    layer.appendChild(a);
  }

  render(currentPeriod());
</script>
</body>
</html>
